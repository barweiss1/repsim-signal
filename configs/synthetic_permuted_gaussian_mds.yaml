version: 1
run_name: modify_base
stages: [generate, analyze]

dataset:
  n_points: 500
  dim: 2
  n_clusters: 9
  seed: 42
  balanced: false
  center_sampling: hypersphere

transform:
  mode: modify_base  # modify_base, resample
  seed: 12
  base_seed: 31

base_transform:
  n_permute: 0
  cluster_mixing_probability: 0.0
  noise_scale: 0.1

grid:
  cluster_mixing_probability:
    min: 0.0
    max: 0.4
    num: 5
  noise_scale:
    min: 0.0
    max: 0.2
    num: 5
  n_permute:
    values: [0, 2, 4, 6, 8]

metrics:
  fixed:
    - id: cka_lin
      name: cka
      kwargs: {}
    - id: cka_rbf_sigma_02
      name: cka_rbf
      kwargs: {rbf_sigma: 0.2}
    - id: mutual_knn_dist_k10
      name: mutual_knn_dist
      kwargs: {topk: 10}
  signals:
    names: [cka_rbf, rbf_uka, rbf_rwka_symmetric, rbf_degree_crwka]
    parameter: rbf_sigma
    min: 0.005
    max: 5.0
    num: 30
    scale: log
    integration: average
  signal_sweeps:
    fixed_parameters:
      cluster_mixing_probability: 0.1
      noise_scale: 0.2
      n_permute: 4
  # The single comparison the paper's signal-shape figures draw. Independent
  # of `grid`, so it may name a level the swept grid does not contain.
  signal_shapes:
    fixed_parameters:
      cluster_mixing_probability: 0.0
      noise_scale: 0.2
      n_permute: 4
  # Base against itself with one point translated. Its own bandwidth grid:
  # an RBF kernel cannot see the moved point until sigma is comparable to the
  # translation distance, well past the range the parameter sweeps need.
  outlier_sweep:
    distances: [5, 10, 20, 30]
    point_index: 0
    signals:
      min: 0.005
      max: 50.0
      num: 30
      scale: log

mds:
  random_state: 42
  n_init: 4
  max_iter: 300
  eps: 1.0e-6

visualization:
  encodings:
    color: n_permute
    size: cluster_mixing_probability
    opacity: noise_scale
  include_base: true
  legend_style: colorbar  #  colorbar, markers
  dpi: 300

outputs:
  data_root: data/synthetic_permuted_gaussian_mds
  figures_root: figures/synthetic_permuted_gaussian_mds

execution:
  overwrite_dataset: true
  recompute_metrics: true
  checkpoint_signals: true
