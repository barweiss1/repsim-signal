version: 1
domain: vision
run_root: data/resi/runs
analysis_root: figures/resi
quality_measures: [AUPRC, violation_rate, correlation, pearsonr, spearmanr, kendalltau]
# The softmax variants are intentionally excluded to preserve the established vision suite.
measures:
  - MutualKNNTop10
  - CKNNATop10
  - sRWKArbfSigma05
  - dRWKArbfSigma05
  - CKArbfSigma05
  - CKArbfSigma02
  - sRWKArbfAUC
  - CKArbfAUC
  - UKArbfAUC
  - dRWKArbfAUC
  - mcRWKArbfAUC
measure_sweeps:
  sRWKArbfAUC: {min: 0.05, max: 10.0, num: 100, scale: log}
  CKArbfAUC: {min: 0.05, max: 10.0, num: 100, scale: log}
  UKArbfAUC: {min: 0.05, max: 10.0, num: 100, scale: log}
  dRWKArbfAUC: {min: 0.05, max: 10.0, num: 100, scale: log}
  mcRWKArbfAUC: {min: 0.05, max: 10.0, num: 100, scale: log}
known_missing_models:
  - benchmark: randomlabel
    dataset: ImageNet100
    architecture: ViT_L32
    setting: Randomlabel
    train_dataset: RandomLabel_100_IN100_DataModule
    seed: 4
    reason: Upstream ReSi checkpoint produces entirely non-finite final-layer representations.
  - benchmark: randomlabel
    dataset: ImageNet100
    architecture: ViT_B32
    setting: Randomlabel
    train_dataset: RandomLabel_100_IN100_DataModule
    seed: 0
    reason: >-
      Upstream ReSi checkpoint collapses its final-layer representations: over
      half of all pairwise distances sit at one float32 quantization step, so no
      RBF bandwidth is resolvable and every kernel measure fails. Neighbor
      measures still return values, but only because exact ties are broken by
      index order, which makes those values an artifact rather than geometry.
benchmarks:
  - id: augmentation
    dataset: ImageNet100
    base_config: configs/vision/IN100_augmentation.yaml
    architectures: [ViT_L32, ViT_B32, ResNet18, ResNet34, ResNet101, VGG11, VGG19]
    baselines:
      - path: vision/in100_augment_vitl32.parquet
        architectures: [ViT_L32]
        name: vitl32
      - path: vision/in100_augment_vitb32.parquet
        architectures: [ViT_B32]
        name: vitb32
      - path: vision/in100_augment_resnet18.parquet
        architectures: [ResNet18]
        name: resnet18
      - path: vision/in100_augment_resnet34.parquet
        architectures: [ResNet34]
        name: resnet34
      - path: vision/in100_augment_resnet101.parquet
        architectures: [ResNet101]
        name: resnet101
      - path: vision/in100_augment_vgg11.parquet
        architectures: [VGG11]
        name: vgg11
      - path: vision/in100_augment_vgg19.parquet
        architectures: [VGG19]
        name: vgg19
  - id: randomlabel
    dataset: ImageNet100
    base_config: configs/vision/IN100_randomlabel.yaml
    architectures: [ViT_L32, ViT_B32, ResNet18, ResNet34, ResNet101, VGG11, VGG19]
    baselines:
      - path: vision/in100_randomlabel_vitl32.parquet
        architectures: [ViT_L32]
        name: vitl32
      - path: vision/in100_randomlabel_vitb32.parquet
        architectures: [ViT_B32]
        name: vitb32
      - path: vision/in100_randomlabel_resnet18.parquet
        architectures: [ResNet18]
        name: resnet18
      - path: vision/in100_randomlabel_resnet34.parquet
        architectures: [ResNet34]
        name: resnet34
      - path: vision/in100_randomlabel_resnet101.parquet
        architectures: [ResNet101]
        name: resnet101
      - path: vision/in100_randomlabel_vgg11.parquet
        architectures: [VGG11]
        name: vgg11
      - path: vision/in100_randomlabel_vgg19.parquet
        architectures: [VGG19]
        name: vgg19
  - id: shortcut
    dataset: ImageNet100
    base_config: configs/vision/IN100_shortcut.yaml
    architectures: [ViT_L32, ViT_B32, ResNet18, ResNet34, ResNet101, VGG11, VGG19]
    baselines:
      - path: vision/in100_shortcut_vitl32.parquet
        architectures: [ViT_L32]
        name: vitl32
      - path: vision/in100_shortcut_vitb32.parquet
        architectures: [ViT_B32]
        name: vitb32
      - path: vision/in100_shortcut_resnet18.parquet
        architectures: [ResNet18]
        name: resnet18
      - path: vision/in100_shortcut_resnet34.parquet
        architectures: [ResNet34]
        name: resnet34
      - path: vision/in100_shortcut_resnet101.parquet
        architectures: [ResNet101]
        name: resnet101
      - path: vision/in100_shortcut_vgg11.parquet
        architectures: [VGG11]
        name: vgg11
      - path: vision/in100_shortcut_vgg19.parquet
        architectures: [VGG19]
